name: kilatmart-a1

services:
  orders-db:
    image: postgres:16.13-bookworm
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - orders-data:/var/lib/postgresql/data
      - ./sql/orders.sql:/docker-entrypoint-initdb.d/01-orders.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "demo", "-d", "shop"]
      interval: 2s
      timeout: 3s
      retries: 25

  analytics-db:
    image: postgres:16.13-bookworm
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - analytics-data:/var/lib/postgresql/data
      - ./sql/analytics.sql:/docker-entrypoint-initdb.d/01-analytics.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "demo", "-d", "analytics"]
      interval: 2s
      timeout: 3s
      retries: 25

  kafka:
    image: quay.io/debezium/kafka:3.4
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      NODE_ID: "1"
      NODE_ROLE: combined
      KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_RETENTION_HOURS: "168"
    volumes:
      - kafka-data:/kafka/data
    healthcheck:
      test: ["CMD", "/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 4s
      timeout: 8s
      retries: 20

  connect:
    image: quay.io/debezium/connect:3.4
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: kilatmart-connect
      CONFIG_STORAGE_TOPIC: kilatmart-connect-configs
      OFFSET_STORAGE_TOPIC: kilatmart-connect-offsets
      STATUS_STORAGE_TOPIC: kilatmart-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
    depends_on:
      orders-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  register-connector:
    image: python:3.12.16-slim-bookworm
    command: ["python", "-u", "/app/register_connector.py"]
    volumes:
      - ./connect:/app:ro
    depends_on:
      connect:
        condition: service_started

  consumer:
    build: ./consumer
    init: true
    environment:
      ANALYTICS_DSN: postgresql://demo:demo@analytics-db:5432/analytics
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      analytics-db:
        condition: service_healthy
      register-connector:
        condition: service_completed_successfully

volumes:
  orders-data:
  analytics-data:
  kafka-data:

